name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: yaseen-vm/git-crew@master
        with:
          llm-provider: groq
          api-key: ${{ secrets.GROQ_API_KEY }}
          post-comment: 'true'
